name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Smoke render (--once)
        if: matrix.os == 'ubuntu-latest'
        run: go run . --once -q rg > /dev/null

      - name: GoReleaser config check
        if: matrix.os == 'ubuntu-latest'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - name: git-cliff config check
        if: matrix.os == 'ubuntu-latest'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased
        env:
          GITHUB_REPO: ${{ github.repository }}
