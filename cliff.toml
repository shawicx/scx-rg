# git-cliff 配置：Keep a Changelog 风格 + 中文 emoji 分组
# 用法：release.yml 里 `git-cliff --latest` 产出当前 tag 的变更记录，
# 经 goreleaser --release-notes 注入 GitHub Release 正文。
[changelog]
header = ""
# 分组顺序由 groups 数组决定（新功能优先），不依赖 group_by 的默认排序
body = """
{%- if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% set groups = ["🚀 新功能", "🐛 Bug 修复", "⚡ 性能优化", "♻️ 代码重构", "📝 文档", "✅ 测试", "🔧 杂项", "🧰 其他"] %}\
{% for g in groups %}\
{%- set gcommits = commits | filter(attribute="group", value=g) %}\
{% if gcommits | length > 0 %}\
### {{ g }}
{% for commit in gcommits %}\
- {{ commit.message | upper_first | trim }}
{% endfor %}\
{% endif %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "🚀 新功能" },
    { message = "^fix", group = "🐛 Bug 修复" },
    { message = "^perf", group = "⚡ 性能优化" },
    { message = "^refactor", group = "♻️ 代码重构" },
    { message = "^doc", group = "📝 文档" },
    { message = "^test", group = "✅ 测试" },
    { message = "^chore|^build|^ci", group = "🔧 杂项" },
    { message = ".*", group = "🧰 其他" },
]
